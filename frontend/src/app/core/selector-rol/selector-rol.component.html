<div class="d-flex flex-column align-items-center justify-content-center vh-100 bg-light">
  <div class="card shadow-sm" style="min-width: 320px;">
    <div class="card-body text-center">
      <h1 class="h4 mb-3">Gestor de Crédito</h1>
      <p class="text-muted mb-4">Selecciona con qué rol vas a ingresar</p>

      <div class="d-grid gap-2">
        <button type="button" class="btn btn-primary" (click)="elegirRol('Administrador')">
          Administrador
        </button>
        <button type="button" class="btn btn-primary" (click)="elegirRol('Asesor')">
          Asesor
        </button>
        <button type="button" class="btn btn-primary" (click)="elegirRol('Aprobador')">
          Aprobador
        </button>
        <button type="button" class="btn btn-primary" (click)="elegirRol('Cajero')">
          Cajero
        </button>
      </div>
    </div>
  </div>
</div>
