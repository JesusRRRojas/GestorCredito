<h1 class="h4 mb-4">Pantalla 6 — Prospectos Listos para Desembolso</h1>

<table class="table table-sm">
  <thead>
    <tr>
      <th>Número de Documento</th>
      <th>Cliente</th>
      <th>Producto</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    @for (p of prospectos(); track p.id) {
      <tr>
        <td>{{ p.numeroDocumento }}</td>
        <td>{{ p.nombreCompleto }}</td>
        <td>{{ p.productoNombre }}</td>
        <td>
          <a class="btn btn-sm btn-primary" [routerLink]="['/desembolso', p.id]">Gestionar</a>
        </td>
      </tr>
    } @empty {
      <tr>
        <td colspan="4" class="text-muted">No hay prospectos listos para desembolso.</td>
      </tr>
    }
  </tbody>
</table>
