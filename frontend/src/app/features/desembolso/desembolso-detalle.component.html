<a routerLink="/desembolso" class="btn btn-sm btn-outline-secondary mb-3">&larr; Volver a la bandeja</a>

<app-encabezado-cliente [prospecto]="prospecto()" />

@if (prospecto(); as p) {
  <h1 class="h4 mb-3">Desembolso: {{ p.nombres }} {{ p.apellidos }} ({{ p.numeroDocumento }})</h1>
  <p><strong>Producto:</strong> {{ p.productoNombre }}</p>
  <p><strong>Cuenta de Desembolso:</strong> {{ descripcionCuenta(p) }}</p>

  @if (!cerrado()) {
    <div class="d-flex gap-2">
      <button class="btn btn-primary" (click)="generarPdf()">Generar PDF Final</button>
      <button class="btn btn-success" [disabled]="!pdfGenerado()" (click)="cerrarProceso()">
        Cerrar Proceso
      </button>
    </div>
  } @else {
    <div class="alert alert-success d-flex justify-content-between align-items-center">
      <span>Proceso cerrado. El prospecto ya figura en el historial.</span>
      <button class="btn btn-success btn-sm" (click)="volver()">Volver a la bandeja</button>
    </div>
  }
}
