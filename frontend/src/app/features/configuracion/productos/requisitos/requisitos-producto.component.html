<a routerLink="/configuracion/productos" class="btn btn-sm btn-outline-secondary mb-3">&larr; Volver a Productos</a>

<h1 class="h4 mb-4">Requisitos del Producto: {{ producto()?.nombre }}</h1>

<table class="table table-sm">
  <thead>
    <tr>
      <th>Nombre</th>
      <th>Activo</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    @for (r of requisitos(); track r.id) {
      <tr>
        <td>{{ r.nombre }}</td>
        <td>{{ r.activo ? 'Sí' : 'No' }}</td>
        <td>
          @if (r.activo) {
            <button class="btn btn-sm btn-outline-danger" (click)="deshabilitar(r.id)">Deshabilitar</button>
          }
        </td>
      </tr>
    } @empty {
      <tr>
        <td colspan="3" class="text-muted">Este Producto todavía no tiene Requisitos configurados.</td>
      </tr>
    }
  </tbody>
</table>

<div class="input-group" style="max-width: 400px;">
  <input class="form-control" [(ngModel)]="nuevoNombre" placeholder="Ej. Copia de DNI" />
  <button class="btn btn-primary" (click)="crear()">Agregar Requisito</button>
</div>
